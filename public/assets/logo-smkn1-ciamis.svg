<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield -->
  <path d="M 100 20 L 160 50 L 160 110 C 160 150 100 175 100 175 C 100 175 40 150 40 110 L 40 50 Z" 
        fill="url(#shieldGradient)" stroke="white" stroke-width="3"/>
  
  <!-- Inner border -->
  <path d="M 100 28 L 152 55 L 152 110 C 152 145 100 168 100 168 C 100 168 48 145 48 110 L 48 55 Z" 
        fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  
  <!-- Left wheat -->
  <g transform="translate(65, 90)">
    <line x1="0" y1="0" x2="0" y2="25" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="-4" cy="8" rx="3" ry="5" fill="#FFD700"/>
    <ellipse cx="-3" cy="15" rx="3" ry="5" fill="#FFD700"/>
    <ellipse cx="-4" cy="22" rx="3" ry="5" fill="#FFD700"/>
    <ellipse cx="4" cy="8" rx="3" ry="5" fill="#FFD700"/>
    <ellipse cx="3" cy="15" rx="3" ry="5" fill="#FFD700"/>
    <ellipse cx="4" cy="22" rx="3" ry="5" fill="#FFD700"/>
  </g>
  
  <!-- Torch/Book with flame -->
  <g transform="translate(100, 85)">
    <!-- Book -->
    <rect x="-8" y="5" width="16" height="15" fill="white" stroke="#333" stroke-width="1"/>
    <line x1="-8" y1="10" x2="8" y2="10" stroke="#333" stroke-width="1"/>
    <line x1="-8" y1="15" x2="8" y2="15" stroke="#333" stroke-width="1"/>
    <!-- Torch handle -->
    <rect x="-4" y="-2" width="8" height="7" fill="white" stroke="#999" stroke-width="1" rx="2"/>
    <!-- Flame -->
    <path d="M -6 -5 Q -8 -15 0 -20 Q 8 -15 6 -5" fill="#FF6B35" stroke="#FF4500" stroke-width="1"/>
    <path d="M -4 -8 Q -5 -12 0 -15 Q 5 -12 4 -8" fill="#FF9100" stroke="none"/>
  </g>
  
  <!-- Right fruits (mango-like) -->
  <g transform="translate(125, 90)">
    <!-- Stem -->
    <line x1="0" y1="-5" x2="0" y2="25" stroke="#666" stroke-width="1.5"/>
    <!-- Fruit 1 (top) -->
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="#7CB342"/>
    <ellipse cx="-3" cy="-6" rx="4" ry="3" fill="white" opacity="0.6"/>
    <!-- Fruit 2 (middle) -->
    <ellipse cx="0" cy="12" rx="6" ry="8" fill="#7CB342"/>
    <ellipse cx="-3" cy="6" rx="4" ry="3" fill="white" opacity="0.6"/>
    <!-- Fruit 3 (bottom) -->
    <ellipse cx="0" cy="24" rx="6" ry="8" fill="#7CB342"/>
    <ellipse cx="-3" cy="18" rx="4" ry="3" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Text: SMKN 1 -->
  <text x="100" y="150" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">
    SMKN 1
  </text>
  
  <!-- Text: CIAMIS -->
  <text x="100" y="170" font-size="18" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">
    CIAMIS
  </text>
  
  <!-- Banner text -->
  <text x="100" y="192" font-size="10" text-anchor="middle" fill="#87CEEB" font-family="Arial" font-style="italic">
    GURU RAHAYU SISWA WALUYA
  </text>
</svg>